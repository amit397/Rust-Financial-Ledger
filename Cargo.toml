[package]
name = "ledger-guard"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ledger-guard"
path = "src/main.rs"

[[bin]]
name = "eval"
path = "src/bin/eval.rs"

[[bin]]
name = "showcase"
path = "src/bin/showcase.rs"

[dependencies]
# Your existing crates
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rustyline = "14"
rand = "0.9"
ctrlc = "3.4"


[dev-dependencies]
proptest = "1"

[profile.release]
opt-level = 3
lto = true